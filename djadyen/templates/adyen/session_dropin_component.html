{% load static i18n %}
<script defer src="{% static 'djadyen/djadyen_session_dropin.js' %}" type="text/javascript"></script>
<link rel="stylesheet" rel="preload" as="style" href="{% static 'djadyen/djadyen.css' %}"></link>
<div
    id="djadyen-config"
    data-session-id="{{ session_id }}"
    data-session-data="{{ session_data }}"
    data-client-key="{{ client_key }}"
    data-country-code="{{ country_code }}"
    data-environment="{{ environment }}"
    data-redirect-url="{{ redirect_url }}"
    data-language="{{ language }}"
    data-payment-types="{{ payment_options }}"
    {% if adyen_styles_json %}data-styles='{{ adyen_styles_json }}'{% endif %}
></div>
<div id="djadyen-dropin-container"></div>
